<!doctype html>
<html lang="en" class="scheme-light-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fornax</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body class="bg-zinc-50 font-sans text-[13.5px]/[1.45] text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
    <div class="grid min-h-screen grid-cols-1 md:grid-cols-[236px_minmax(0,1fr)]">
      <aside class="flex flex-col border-b border-zinc-200 bg-white px-2.5 py-3.5 md:sticky md:top-0 md:h-screen md:overflow-y-auto md:border-b-0 md:border-r dark:border-zinc-800 dark:bg-zinc-900">
        <a class="flex items-baseline gap-2 px-2 pb-3.5 pt-0.5" href="#/">
          <span class="text-[15px] font-bold tracking-tight">fornax</span>
          <span class="truncate text-[12.5px] text-zinc-500 dark:text-zinc-400" id="fleet-name"></span>
        </a>
        <nav id="nav" class="flex-1" aria-label="Fleet"></nav>
        <div id="side-foot" class="mt-3 grid gap-0.5 border-t border-zinc-200 px-2 pt-2.5 text-[11.5px] text-zinc-500 dark:border-zinc-800 dark:text-zinc-400"></div>
      </aside>
      <main id="main" class="w-full max-w-[1280px] px-3 pb-12 pt-4 outline-none md:px-6" tabindex="-1">
        <p class="text-zinc-500 dark:text-zinc-400">loading …</p>
      </main>
    </div>
    <div id="toasts" class="fixed bottom-3.5 right-3.5 z-10 grid max-w-[360px] gap-2" aria-live="assertive"></div>
    <dialog id="confirm" class="m-auto w-[min(480px,calc(100vw-32px))] rounded-xl border border-zinc-200 bg-white p-4.5 text-zinc-900 shadow-2xl backdrop:bg-zinc-950/45 dark:border-zinc-800 dark:bg-zinc-900 dark:text-zinc-100"></dialog>
  </body>
</html>
