name: Release

# Push a tag v<version> (matching package.json and src/core/version.ts): tests, binaries for
# macOS and Linux, checksums, the filled-in Homebrew formula — all attached to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(bun -e 'console.log(require("./package.json").version)')
          src=$(sed -n 's/^export const VERSION = "\(.*\)";/\1/p' src/core/version.ts)
          [ "$tag" = "$pkg" ] && [ "$tag" = "$src" ] || { echo "tag $tag, package.json $pkg, version.ts $src"; exit 1; }

      - run: bun run typecheck
      - run: bun run test
      - run: bash scripts/build.sh

      - name: Checksums and Homebrew formula
        run: |
          cd dist
          sha256sum fornax-*.tar.gz > SHA256SUMS
          cd ..
          bash scripts/homebrew.sh "${GITHUB_REF_NAME#v}" "${{ github.repository }}" dist/SHA256SUMS > dist/fornax.rb

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="## ${GITHUB_REF_NAME#v}" 'index($0, v) == 1 {p = 1; next} /^## / && p {exit} p' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/fornax-*.tar.gz dist/SHA256SUMS dist/fornax.rb \
            --title "fornax ${GITHUB_REF_NAME#v}" --notes "${notes:-See CHANGELOG.md}" \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)

      # optional: keep a tap repo (owner/homebrew-fornax) current — needs a token that may push there
      - name: Update the Homebrew tap
        if: ${{ vars.HOMEBREW_TAP != '' }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ vars.HOMEBREW_TAP }}.git" tap
          mkdir -p tap/Formula && cp dist/fornax.rb tap/Formula/fornax.rb
          cd tap
          git config user.name "fornax release" && git config user.email "actions@users.noreply.github.com"
          git add Formula/fornax.rb && git commit -m "fornax ${GITHUB_REF_NAME#v}" && git push
