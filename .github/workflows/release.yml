name: Release

# Push a tag v<version> (matching package.json and src/core/version.ts; `bun run release <version>`
# does it): tests, binaries for macOS and Linux, checksums, the filled-in Homebrew formula, the
# signature — all attached to a GitHub release. Run it by hand ("Run workflow") for a dry run: the
# build job's result as an artifact, unsigned.
#
# Two jobs: the build (dependencies, tests, compiler) never sees the release key; signing and
# publishing run in the environment "release", which only v* tags may use. Actions are pinned by
# commit (the tag they were taken from in the comment).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Tag matches the version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(bun -e 'console.log(require("./package.json").version)')
          src=$(sed -n 's/^export const VERSION = "\(.*\)";/\1/p' src/core/version.ts)
          [ "$tag" = "$pkg" ] && [ "$tag" = "$src" ] || { echo "tag $tag, package.json $pkg, version.ts $src"; exit 1; }

      - run: bun run typecheck
      - run: bun run test
      - run: bash scripts/build.sh

      - name: Checksums and Homebrew formula
        run: |
          cd dist
          sha256sum fornax-*.tar.gz > SHA256SUMS
          cd ..
          v=$(bun -e 'console.log(require("./package.json").version)')
          bash scripts/homebrew.sh "$v" "${{ github.repository }}" dist/SHA256SUMS > dist/fornax.rb

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.ref_type == 'tag' && 'fornax-dist' || 'fornax-dry-run' }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/fornax.rb

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fornax-dist
          path: dist

      # self-update installs only what this signature covers (no dependencies needed: node:crypto only)
      - name: Sign the checksums
        env:
          FORNAX_RELEASE_KEY: ${{ secrets.FORNAX_RELEASE_KEY }}
        run: |
          [ -n "$FORNAX_RELEASE_KEY" ] || { echo "secret FORNAX_RELEASE_KEY is missing in the environment release"; exit 1; }
          bun scripts/sign.ts dist/SHA256SUMS

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="## ${GITHUB_REF_NAME#v}" 'index($0, v) == 1 {p = 1; next} /^## / && p {exit} p' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/fornax-*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sig dist/fornax.rb \
            --title "fornax ${GITHUB_REF_NAME#v}" --notes "${notes:-See CHANGELOG.md}" \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)

      # optional: keep a tap repo (owner/homebrew-fornax) current — needs a token that may push there
      - name: Update the Homebrew tap
        if: vars.HOMEBREW_TAP != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ vars.HOMEBREW_TAP }}.git" tap
          mkdir -p tap/Formula && cp dist/fornax.rb tap/Formula/fornax.rb
          cd tap
          git config user.name "fornax release" && git config user.email "actions@users.noreply.github.com"
          git add Formula/fornax.rb && git commit -m "fornax ${GITHUB_REF_NAME#v}" && git push
